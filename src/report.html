<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>麦麦场景营养师 · 营养报告</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root { --bg:#0f1115; --card:#171a21; --accent:#ffc600; --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --text:#e6e8eb; --muted:#9aa3af; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; padding:32px; }
    h1 { font-size:24px; margin:0 0 4px; }
    .sub { color:var(--muted); margin-bottom:24px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:980px; }
    .card { background:var(--card); border:1px solid #232733; border-radius:16px; padding:20px; }
    .card h2 { font-size:15px; margin:0 0 12px; color:var(--muted); font-weight:600; }
    .bars div { margin:10px 0; }
    .bars label { display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; }
    .track { height:10px; background:#232733; border-radius:6px; overflow:hidden; }
    .fill { height:100%; border-radius:6px; }
    .note { margin-top:16px; font-size:13px; color:var(--muted); line-height:1.6; }
    .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; margin-left:8px; }
    .badge.ok { background:rgba(52,211,153,.15); color:var(--ok); }
    .badge.bad { background:rgba(248,113,113,.15); color:var(--bad); }
  </style>
</head>
<body>
  <h1>麦麦场景营养师 · 营养报告</h1>
  <div class="sub">场景：减脂期 · 目标 ≤600kcal / 蛋白充足 · 数据以麦当劳官方实时结果为准</div>

  <div class="grid">
    <div class="card">
      <h2>营养雷达（钠超标时自然内凹）</h2>
      <canvas id="radar" height="220"></canvas>
    </div>
    <div class="card">
      <h2>三餐热量分布</h2>
      <canvas id="donut" height="220"></canvas>
    </div>
    <div class="card" style="grid-column:1 / -1;">
      <h2>目标达成进度</h2>
      <div class="bars">
        <div><label>热量 <span>548 / 600 kcal</span></label><div class="track"><div class="fill" style="width:91%;background:var(--ok)"></div></div></div>
        <div><label>蛋白质 <span>38 / 35 g</span></label><div class="track"><div class="fill" style="width:100%;background:var(--ok)"></div></div></div>
        <div><label>钠 <span>1180 / 1000 mg</span></label><div class="track"><div class="fill" style="width:100%;background:var(--bad)"></div></div></div>
      </div>
      <div class="note">营养师点评：蛋白达标 ✓；钠轻微超标，建议次日选品控盐。<span class="badge bad">钠超标</span></div>
    </div>
  </div>

  <script>
    new Chart(document.getElementById('radar'), {
      type:'radar',
      data:{ labels:['热量','蛋白质','膳食纤维','钙','铁','维生素C'],
        datasets:[{ data:[548,38,6,220,3.2,18], fill:true,
          backgroundColor:'rgba(255,198,0,.18)', borderColor:'#ffc600' }] },
      options:{ scales:{ r:{ grid:{color:'#2a2f3a'}, angleLines:{color:'#2a2f3a'},
        pointLabels:{color:'#9aa3af'}, ticks:{display:false} } }, plugins:{legend:{display:false}} }
    });
    new Chart(document.getElementById('donut'), {
      type:'doughnut',
      data:{ labels:['早餐','午餐','晚餐'], datasets:[{ data:[120,328,100],
        backgroundColor:['#ffc600','#34d399','#60a5fa'] }] },
      options:{ plugins:{legend:{position:'bottom',labels:{color:'#9aa3af'}}} }
    });
  </script>
</body>
</html>
